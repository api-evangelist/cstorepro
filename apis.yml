name: CStorePro
description: CStorePro is a convenience-store back-office and retail-management software platform for
  independent and chain c-store operators. Founded as CStorePro and later rebranded to CStore Essentials
  (CSE), it is now part of PDI Technologies and marketed as PDI Essentials. The platform provides back-office
  operations, pricebook and inventory management, lottery and fuel tracking, automated financial reporting
  and reconciliation, Skupos scan-data submission for tobacco manufacturer rebates, tobacco loyalty
  (Skupos Engage), and GasBuddy Business Pages reputation management. It connects directly to POS systems
  including Gilbarco, Verifone, and NCR for automatic sales and inventory sync. There is no public developer
  API or documented API program at this time; the product is delivered as a hosted web and mobile application.
